name: Validate knowledge contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate structured knowledge
        run: python scripts/validate.py

      - name: Validate cumulative knowledge graph
        run: python scripts/validate_graph.py

      - name: Validate research bundles
        run: python scripts/validate_bundles.py

      - name: Validate researched case patches
        run: python scripts/validate_case_patches.py

      - name: Test prior-knowledge retrieval
        run: |
          python scripts/graph_context.py --self-test
          python scripts/scaffold_bundle.py --self-test

      - name: Validate browser JavaScript
        run: |
          node --check app.js
          node --check library.js

      - name: Run pipeline acceptance tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile Python utilities
        run: python -m compileall -q scripts tests
