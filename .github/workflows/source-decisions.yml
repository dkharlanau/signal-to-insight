name: Validate source decisions

on:
  push:
    branches: [main]
    paths:
      - "data/source-decisions.json"
      - "data/claim-evidence.json"
      - "data/insights.json"
      - "data/inbox.json"
      - "data/research-bundles/**"
      - "scripts/validate_source_decisions.py"
      - "decision.js"
      - "decision.css"
      - "app.js"
      - ".github/workflows/source-decisions.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/source-decisions.json"
      - "data/claim-evidence.json"
      - "data/insights.json"
      - "data/inbox.json"
      - "data/research-bundles/**"
      - "scripts/validate_source_decisions.py"
      - "decision.js"
      - "decision.css"
      - "app.js"
      - ".github/workflows/source-decisions.yml"

permissions:
  contents: read

jobs:
  source-decisions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source decisions
        run: python scripts/validate_source_decisions.py

      - name: Validate decision UI JavaScript
        run: |
          node --check decision.js
          node --check app.js

      - name: Verify the app shell loads the decision UI
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.js').read_text(encoding='utf-8')
          required = ['../../decision.css', '../../decision.js', 'dataset.sourceDecisionUi']
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('source-decision loader missing from app.js: ' + ', '.join(missing))
          print('Source-decision UI is wired directly by app.js.')
          PY
