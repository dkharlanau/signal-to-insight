name: Sync multi-source syntheses

on:
  push:
    branches: [main]
    paths:
      - "data/syntheses.json"
      - "data/insights.json"
      - "data/claim-evidence.json"
      - "data/knowledge-reviews.json"
      - "scripts/build_syntheses.py"
      - "scripts/validate_syntheses.py"
      - "synthesis.css"
      - ".github/workflows/syntheses.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/syntheses.json"
      - "data/insights.json"
      - "data/claim-evidence.json"
      - "data/knowledge-reviews.json"
      - "scripts/build_syntheses.py"
      - "scripts/validate_syntheses.py"
      - "synthesis.css"
      - ".github/workflows/syntheses.yml"

permissions:
  contents: write

jobs:
  syntheses:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate synthesis records
        run: python scripts/validate_syntheses.py

      - name: Build synthesis pages
        run: python scripts/build_syntheses.py

      - name: Verify synthesis pages on pull requests
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- synthesis-previews syntheses)" ]; then
            git status --short -- synthesis-previews syntheses
            echo "Generated synthesis pages are missing or stale."
            exit 1
          fi

      - name: Commit synced synthesis pages on main
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain -- synthesis-previews syntheses)" ]; then
            echo "Synthesis pages already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add synthesis-previews syntheses
          git commit -m "build: sync multi-source syntheses"
          git push origin HEAD:main
