name: Sync generated explainers

on:
  push:
    branches: [main]
    paths:
      - "data/insights.json"
      - "data/sources.json"
      - "data/knowledge-deltas.json"
      - "scripts/build.py"
      - "styles.css"
      - "explainer.css"
      - "visual-plan.css"
      - "retention.css"
      - "app.js"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generated-pages:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild explainers
        run: python scripts/build.py

      - name: Verify generated pages on pull requests
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- explainers)" ]; then
            git status --short -- explainers
            echo "Generated explainer pages are missing or stale."
            exit 1
          fi

      - name: Commit synced explainers on main
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain -- explainers)" ]; then
            echo "Generated explainers already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explainers
          git commit -m "build: sync generated explainers"
          git push origin HEAD:main
