name: Verify generated explainers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generated-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild explainers
        run: python scripts/build.py

      - name: Generated pages must be committed
        run: |
          if [ -n "$(git status --porcelain -- explainers)" ]; then
            git status --short -- explainers
            echo "Generated explainer pages are missing or stale."
            exit 1
          fi
