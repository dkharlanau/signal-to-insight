name: Queue source issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  queue:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, '[source]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse issue and update inbox
        id: queue
        run: python scripts/queue_issue.py --event "$GITHUB_EVENT_PATH"

      - name: Commit queued source
        if: steps.queue.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inbox.json
          git commit -m "intake: queue source from issue #${{ github.event.issue.number }}"
          git push origin HEAD:main

      - name: Report intake result
        uses: actions/github-script@v7
        env:
          INTAKE_STATUS: ${{ steps.queue.outputs.status }}
          INTAKE_ID: ${{ steps.queue.outputs.id }}
          INTAKE_URL: ${{ steps.queue.outputs.url }}
        with:
          script: |
            const status = process.env.INTAKE_STATUS;
            const id = process.env.INTAKE_ID;
            const url = process.env.INTAKE_URL;
            let message;
            if (status === 'queued') {
              message = `Queued as \`${id}\`. Normalized source: ${url}`;
            } else if (status === 'already_queued') {
              message = `This source/focus is already queued as \`${id}\`. Normalized source: ${url}`;
            } else {
              message = `This source is already registered as \`${id}\`. Normalized source: ${url}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
