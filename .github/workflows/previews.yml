name: Sync review previews

on:
  push:
    branches: [main]
    paths:
      - "data/insights.json"
      - "data/sources.json"
      - "data/knowledge-deltas.json"
      - "scripts/build.py"
      - "scripts/build_previews.py"
      - "styles.css"
      - "explainer.css"
      - "visual-plan.css"
      - "retention.css"
      - "preview.css"
      - "app.js"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  previews:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test preview safety boundary
        run: python scripts/build_previews.py --self-test

      - name: Rebuild review previews
        run: python scripts/build_previews.py

      - name: Verify previews on pull requests
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- previews)" ]; then
            git status --short -- previews
            echo "Generated review previews are missing or stale."
            exit 1
          fi

      - name: Commit synced previews on main
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain -- previews)" ]; then
            echo "Review previews already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews
          git commit -m "build: sync review previews"
          git push origin HEAD:main
